<!DOCTYPE html>
  <input type="number" id="cr" value="10">

  <button onclick="runModel()">Run Analysis</button>
</div>

<div class="main">

  <div class="topCards">

    <div class="card">
      <h2>⚡ Efficiency</h2>
      <h1 id="eff">0%</h1>
    </div>

    <div class="card">
      <h2>🌫 Exhaust Quality</h2>
      <h1 id="quality">0/10</h1>
    </div>

    <div class="card">
      <h2>🩺 Vehicle Health</h2>
      <h1 id="health">0/100</h1>
    </div>

  </div>

  <div class="graphContainer">
    <div class="graphBox">
      <canvas id="rpmGraph"></canvas>
    </div>

    <div class="graphBox">
      <canvas id="tempGraph"></canvas>
    </div>

    <div class="graphBox">
      <canvas id="crGraph"></canvas>
    </div>
  </div>

  <div class="diagnosisBox">
    <h2>🤖 AI Diagnosis</h2>

    <p id="diagnosis"></p>
    <p id="solution"></p>
    <p id="severity"></p>
  </div>

</div>

<script src="script.js"></script>

</body>
</html>
