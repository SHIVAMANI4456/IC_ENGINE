<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AI Vehicle Health Dashboard</title>

  <link rel="stylesheet" href="style.css">

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>

<!-- SIDEBAR -->
<div class="sidebar">

  <h1>🚗 AI Engine Monitor</h1>

  <label>Fuel Type</label>
  <select id="fuel">
    <option>Petrol</option>
    <option>Diesel</option>
    <option>Ethanol</option>
    <option>CNG</option>
  </select>

  <label>RPM</label>
  <input type="number" id="rpm" value="3000">

  <label>Temperature (°C)</label>
  <input type="number" id="temp" value="80">

  <label>Compression Ratio</label>
  <input type="number" id="cr" value="10">

  <button onclick="runModel()">Run Analysis</button>

</div>

<!-- MAIN -->
<div class="main">

  <!-- TOP CARDS -->
  <div class="topCards">

    <div class="card">
      <h2>⚡ Efficiency</h2>
      <h1 id="eff">0%</h1>
    </div>

    <div class="card">
      <h2>🌫 Exhaust Quality</h2>
      <h1 id="quality">0/10</h1>
    </div>

    <div class="card">
      <h2>🩺 Vehicle Health</h2>
      <h1 id="health">0/100</h1>
    </div>

  </div>

  <!-- GRAPHS -->
  <div class="graphContainer">

    <div class="graphBox">
      <canvas id="rpmGraph"></canvas>
    </div>

    <div class="graphBox">
      <canvas id="tempGraph"></canvas>
    </div>

    <div class="graphBox">
      <canvas id="crGraph"></canvas>
    </div>

  </div>

  <!-- AI DIAGNOSIS -->
  <div class="diagnosisBox">

    <h2>🤖 AI Diagnosis</h2>

    <p id="diagnosis"></p>
    <p id="solution"></p>
    <p id="severity"></p>

  </div>

</div>

<script src="script.js"></script>

</body>
</html>
